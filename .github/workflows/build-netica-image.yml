name: Build Netica Kasm image

on:
  workflow_dispatch:
  push:
    branches:
      - "1.1"
    paths:
      - "images/netica/**"
      - ".github/workflows/build-netica-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: images/netica
          push: true
          platforms: linux/amd64
          no-cache: true
          tags: |
            ghcr.io/nam-h-pham/netica-kasm:1.19-winefix
            ghcr.io/nam-h-pham/netica-kasm:1.19
            ghcr.io/nam-h-pham/netica-kasm:latest
